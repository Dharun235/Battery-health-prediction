[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-health-prediction"
version = "1.0.0"
description = "Time-series forecasting for Li-ion battery capacity degradation and remaining useful life estimation"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Dharun Kumar", email = "dharunkumar@example.com"},
    {name = "Dhruvkumar Patel", email = "dhruvkumar@example.com"}
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.7.0",
    "torch>=1.10.0",
    "transformers>=4.20.0",
    "matplotlib>=3.4.0",
    "pyyaml>=6.0",
    "tqdm>=4.62.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "isort>=5.10.0",
]
viz = [
    "seaborn>=0.11.0",
    "plotly>=5.0.0",
]
jupyter = [
    "jupyter>=1.0.0",
    "jupyterlab>=3.0.0",
    "ipython>=7.0.0",
]

[project.urls]
Repository = "https://github.com/Dharun235/Battery-health-prediction"
Documentation = "https://github.com/Dharun235/Battery-health-prediction/tree/main/docs"
"Model Hub" = "https://huggingface.co/Dharunkumar9/battery-capacity-predictor"

[tool.setuptools]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=html --cov-report=term-missing"
